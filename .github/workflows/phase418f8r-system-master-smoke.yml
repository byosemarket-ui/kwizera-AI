# Phase 4.18F.8R — VPS System Master ON/OFF + scheduled analysis smoke (no analyze-now).
# Owner policy: System Master rests OFF. The always() cleanup step restores and independently
# verifies OFF after success, failure, timeout or cancellation, and fails the job if it cannot.
name: Phase 418F8R system master smoke

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Expected deployed commit SHA
        required: false
  workflow_run:
    workflows: ["Production deploy"]
    types: [completed]
    branches: [main]

# Shared with every workflow that switches System Master ON, so one run's cleanup can never
# switch OFF another run's in-progress test. Runs queue instead of being cancelled mid-test.
concurrency:
  group: vps-system-master-ownership
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  statuses: read
  # Needed to publish redacted cycle/observation evidence as a commit comment.
  # (Same pattern as Phase 4.18F.7 smoke evidence comments.)

jobs:
  verify:
    name: VPS System Master smoke
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY" >&2
            exit 1
          fi

      - name: Prepare SSH
        id: ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os, pathlib
          home = pathlib.Path.home() / ".ssh"
          def write(name, raw, unescape_if_single_line=True):
              text = (raw or "").replace("\r\n", "\n").replace("\r", "\n")
              if unescape_if_single_line and "BEGIN" in text and text.count("\n") < 2:
                  text = text.replace("\\n", "\n")
              if text and not text.endswith("\n"):
                  text += "\n"
              (home / name).write_text(text, encoding="utf-8")
          write("deploy_key", os.environ["VPS_SSH_KEY"])
          known = os.environ.get("VPS_KNOWN_HOSTS", "")
          if known.strip():
              hosts = known.replace("\r\n", "\n").replace("\r", "\n")
              if hosts.count("\n") < 1:
                  hosts = hosts.replace("\\n", "\n")
              if hosts and not hosts.endswith("\n"):
                  hosts += "\n"
              (home / "known_hosts").write_text(hosts, encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/deploy_key"
          PORT_CANDIDATES=(2222 22)
          USER_CANDIDATES=("root")
          if [ -n "${VPS_USER:-}" ] && [ "$VPS_USER" != "root" ]; then
            USER_CANDIDATES+=("$VPS_USER")
          fi
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o NumberOfPasswordPrompts=0 -o ConnectTimeout=12 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -o StrictHostKeyChecking=accept-new"
          SSH_PORT=""
          SSH_LOGIN=""
          for candidate in "${PORT_CANDIDATES[@]}"; do
            ssh-keyscan -p "$candidate" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "$HOME/.ssh/known_hosts"
            for login in "${USER_CANDIDATES[@]}"; do
              # shellcheck disable=SC2086
              if ssh $SSH_OPTS -p "$candidate" "$login@$VPS_HOST" "echo SSH_OK" >/dev/null 2>&1; then
                SSH_PORT="$candidate"
                SSH_LOGIN="$login"
                break 2
              fi
            done
          done
          if [ -z "$SSH_PORT" ]; then
            echo "SSH authentication failed" >&2
            exit 1
          fi
          {
            echo "SSH_OPTS=$SSH_OPTS"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_LOGIN=$SSH_LOGIN"
          } >> "$GITHUB_ENV"

      - name: Run System Master smoke on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          EXPECT_SHA: ${{ github.event.inputs.sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/tmp/kwizera-phase418f8r-$$"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" "mkdir -p '$REMOTE_DIR/lib'"
          # shellcheck disable=SC2086
          scp $SSH_OPTS -P "$SSH_PORT" scripts/lib/load-operator-env.mjs "$SSH_LOGIN@$VPS_HOST:$REMOTE_DIR/lib/load-operator-env.mjs"
          # shellcheck disable=SC2086
          scp $SSH_OPTS -P "$SSH_PORT" scripts/phase418f8r-vps-system-master-smoke.mjs "$SSH_LOGIN@$VPS_HOST:$REMOTE_DIR/phase418f8r-vps-system-master-smoke.mjs"
          set +e
          # shellcheck disable=SC2086
          OUT="$(ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" \
            "cd '$REMOTE_DIR' && \
             export KWIZERA_PROD_BASE=http://127.0.0.1:5173 && \
             export KWIZERA_FC_SIDECAR_BASE=http://127.0.0.1:5179 && \
             export KWIZERA_APP_DIR=/opt/kwizera-ai && \
             export KWIZERA_VPS_ENV_FILE=/opt/kwizera-ai/.env && \
             export KWIZERA_EXPECT_SHA='${EXPECT_SHA}' && \
             export KWIZERA_F8R_INSTRUMENT='XAU/USD' && \
             export KWIZERA_F8R_TIMEFRAME='5m' && \
             export KWIZERA_F8R_WAIT_MS=780000 && \
             export KWIZERA_F8R_POLL_MS=10000 && \
             node phase418f8r-vps-system-master-smoke.mjs; \
             rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc")"
          rc=$?
          set -e
          SAFE_OUT="$(printf '%s\n' "$OUT" | python3 -c "import sys,re; t=sys.stdin.read(); t=re.sub(r'(?i)KWIZERA_ADMIN_API_TOKEN\\s*=\\s*\\S+','KWIZERA_ADMIN_API_TOKEN=***REDACTED***',t); t=re.sub(r'(?i)Bearer\\s+[A-Za-z0-9._\\-]+','Bearer ***REDACTED***',t); t=re.sub(r'sk-[A-Za-z0-9]{8,}','***REDACTED***',t); print(t)")"
          printf '%s\n' "$SAFE_OUT"
          {
            echo "## Phase 4.18F.8R System Master smoke"
            echo "expectSha=\`${EXPECT_SHA}\`"
            echo '```json'
            printf '%s\n' "$SAFE_OUT" | tail -n 900
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          export COMMENT_SHA="${EXPECT_SHA}"
          export F8R_EXIT_CODE="${rc}"
          export GITHUB_TOKEN="${{ github.token }}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          printf '%s\n' "$SAFE_OUT" | python3 scripts/phase418f8r-publish-smoke-comment.py || echo "commit_comment_publish_failed"
          exit "$rc"

      - name: Restore and verify System Master OFF (always)
        if: always() && env.SSH_PORT != ''
        timeout-minutes: 5
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pkill -f phase418f8r-vps-system-master-smoke.mjs 2>/dev/null || true
          python3 - <<'PY'
          import json, sys, time, urllib.request
          from pathlib import Path
          token = ""
          for line in Path("/opt/kwizera-ai/.env").read_text(errors="ignore").splitlines():
              if line.strip().startswith("KWIZERA_ADMIN_API_TOKEN="):
                  token = line.split("=", 1)[1].strip().strip('"').strip("'")
          if not token:
              print("CLEANUP_FAILED: admin token unavailable", file=sys.stderr)
              sys.exit(1)
          H = {"Content-Type": "application/json", "Accept": "application/json", "Authorization": f"Bearer {token}"}
          def call(method, path, body=None):
              data = json.dumps(body or {}).encode() if method == "POST" else None
              req = urllib.request.Request(f"http://127.0.0.1:5173{path}", data=data, method=method, headers=H)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())
          sm = {}
          for attempt in range(5):
              try:
                  call("POST", "/api/forex/automated-trading/system-master/off")
                  time.sleep(2)
                  sm = call("GET", "/api/forex/automated-trading/system-master/status").get("systemMaster") or {}
                  mon = call("GET", "/api/forex/automated-trading/monitor/status").get("monitor") or {}
                  worker_enabled = (mon.get("config") or {}).get("enabled")
                  ok = (sm.get("ownerState") == "OFF" and sm.get("operationalState") == "OFF"
                        and (sm.get("activeModuleCount") or 0) == 0 and worker_enabled is not True)
                  print(json.dumps({"ownerState": sm.get("ownerState"), "operationalState": sm.get("operationalState"),
                                    "activeModuleCount": sm.get("activeModuleCount"), "workerEnabled": worker_enabled,
                                    "placesOrders": sm.get("placesOrders"), "verified": ok}))
                  if ok:
                      sys.exit(0)
              except Exception as exc:  # retry: gateway may be restarting
                  print(f"cleanup attempt {attempt + 1} failed: {str(exc)[:160]}", file=sys.stderr)
              time.sleep(5)
          print("CLEANUP_FAILED: System Master OFF could not be verified", file=sys.stderr)
          sys.exit(1)
          PY
          REMOTE
          echo "SYSTEM_MASTER_FINAL=OFF_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
