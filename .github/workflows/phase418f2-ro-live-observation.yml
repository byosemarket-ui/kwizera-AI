# Phase 4.18F.2.1 — VPS READ-ONLY multi-sample live ForexConnect observation.
# Never mutates broker, creates grants, enables mutation, or places orders.
# Does not call OpenAI.
name: Phase 418F2 RO live observation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Expected deployed commit SHA (defaults to this workflow SHA)
        required: false
      observe_seconds:
        description: Bounded observation window in seconds (30-300)
        required: false
        default: "90"
      focus_instrument:
        description: Optional focus instrument (defaults to AT selection / EUR/USD)
        required: false
  workflow_run:
    workflows: ["Production deploy"]
    types: [completed]
    branches: [main]

concurrency:
  group: phase418f2-ro-live-observation
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: read

jobs:
  observe:
    name: VPS RO live market observation
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Require SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY" >&2
            exit 1
          fi

      - name: Run RO live observation on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          EXPECT_SHA: ${{ github.event.inputs.sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
          OBSERVE_SECONDS: ${{ github.event.inputs.observe_seconds || '90' }}
          FOCUS_INSTRUMENT: ${{ github.event.inputs.focus_instrument || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os, pathlib
          home = pathlib.Path.home() / ".ssh"
          def write(name, raw, unescape_if_single_line=True):
              text = (raw or "").replace("\r\n", "\n").replace("\r", "\n")
              if unescape_if_single_line and "BEGIN" in text and text.count("\n") < 2:
                  text = text.replace("\\n", "\n")
              if text and not text.endswith("\n"):
                  text += "\n"
              (home / name).write_text(text, encoding="utf-8")
          write("deploy_key", os.environ["VPS_SSH_KEY"])
          known = os.environ.get("VPS_KNOWN_HOSTS", "")
          if known.strip():
              hosts = known.replace("\r\n", "\n").replace("\r", "\n")
              if hosts.count("\n") < 1:
                  hosts = hosts.replace("\\n", "\n")
              if hosts and not hosts.endswith("\n"):
                  hosts += "\n"
              (home / "known_hosts").write_text(hosts, encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/deploy_key"
          PORT_CANDIDATES=(2222 22)
          USER_CANDIDATES=("root")
          if [ -n "${VPS_USER:-}" ] && [ "$VPS_USER" != "root" ]; then
            USER_CANDIDATES+=("$VPS_USER")
          fi
          SSH_BASE=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o NumberOfPasswordPrompts=0
            -o ConnectTimeout=12
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=120
            -o StrictHostKeyChecking=accept-new
          )
          SSH_PORT=""
          SSH_LOGIN=""
          for candidate in "${PORT_CANDIDATES[@]}"; do
            ssh-keyscan -p "$candidate" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "$HOME/.ssh/known_hosts"
            for login in "${USER_CANDIDATES[@]}"; do
              if ssh "${SSH_BASE[@]}" -p "$candidate" "$login@$VPS_HOST" "echo SSH_OK" >/dev/null 2>&1; then
                SSH_PORT="$candidate"
                SSH_LOGIN="$login"
                break 2
              fi
            done
          done
          if [ -z "$SSH_PORT" ]; then
            echo "SSH authentication failed" >&2
            exit 1
          fi
          REMOTE_DIR="/tmp/kwizera-phase418f2-$$"
          ssh "${SSH_BASE[@]}" -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" "mkdir -p '$REMOTE_DIR/lib'"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            scripts/lib/load-operator-env.mjs \
            "$SSH_LOGIN@$VPS_HOST:$REMOTE_DIR/lib/load-operator-env.mjs"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            scripts/phase418f2-vps-ro-live-observation.mjs \
            "$SSH_LOGIN@$VPS_HOST:$REMOTE_DIR/phase418f2-vps-ro-live-observation.mjs"
          FOCUS_EXPORT=""
          if [ -n "${FOCUS_INSTRUMENT:-}" ]; then
            FOCUS_EXPORT="export KWIZERA_FOCUS_INSTRUMENT='${FOCUS_INSTRUMENT}';"
          fi
          set +e
          OUT="$(ssh "${SSH_BASE[@]}" -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" \
            "cd '$REMOTE_DIR' && \
             export KWIZERA_PROD_BASE=http://127.0.0.1:5173 && \
             export KWIZERA_VPS_ENV_FILE=/opt/kwizera-ai/.env && \
             export KWIZERA_EXPECT_SHA='${EXPECT_SHA}' && \
             export KWIZERA_OBSERVE_SECONDS='${OBSERVE_SECONDS}' && \
             export KWIZERA_SAMPLE_MS=3000 && \
             ${FOCUS_EXPORT} \
             node phase418f2-vps-ro-live-observation.mjs; \
             rc=\$?; rm -rf '$REMOTE_DIR'; exit \$rc")"
          rc=$?
          set -e
          SAFE_OUT="$(printf '%s\n' "$OUT" | python3 -c "import sys,re; t=sys.stdin.read(); t=re.sub(r'(?i)KWIZERA_ADMIN_API_TOKEN\\s*=\\s*\\S+','KWIZERA_ADMIN_API_TOKEN=***REDACTED***',t); t=re.sub(r'(?i)Bearer\\s+[A-Za-z0-9._\\-]+','Bearer ***REDACTED***',t); print(t)")"
          printf '%s\n' "$SAFE_OUT"
          {
            echo "## Phase 4.18F.2.1 RO live observation"
            echo "expectSha=\`${EXPECT_SHA}\` observeSeconds=\`${OBSERVE_SECONDS}\`"
            echo '```json'
            printf '%s\n' "$SAFE_OUT" | tail -n 800
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Public redacted evidence excerpt (no secrets) for unsigned verification.
          BODY_FILE="${RUNNER_TEMP}/phase418f2-live-obs-comment.md"
          {
            echo "### Phase 4.18F.2.1 live observation (redacted)"
            echo
            echo "expectSha=\`${EXPECT_SHA}\` observeSeconds=\`${OBSERVE_SECONDS}\` exit=\`${rc}\`"
            echo
            echo '```json'
            printf '%s\n' "$SAFE_OUT" | python3 -c "
import sys, json, re
raw = sys.stdin.read()
# Prefer the last JSON object in the output.
m = None
for match in re.finditer(r'\\{[\\s\\S]*\\}', raw):
    m = match
text = m.group(0) if m else raw[-12000:]
try:
    obj = json.loads(text)
    slim = {
      'phase': obj.get('phase'),
      'focusInstrument': obj.get('focusInstrument'),
      'observeSeconds': obj.get('observeSeconds'),
      'labels': obj.get('labels'),
      'evidence': {
        'deployment': (obj.get('evidence') or {}).get('deployment'),
        'forexconnect': (obj.get('evidence') or {}).get('forexconnect'),
        'summary': (obj.get('evidence') or {}).get('summary'),
      },
      'instrumentOutcomes': {
        k: {
          'outcome': v.get('outcome'),
          'genuineChanges': v.get('genuineChanges'),
          'identicalSamples': v.get('identicalSamples'),
          'samples': v.get('samples'),
          'netBidMove': v.get('netBidMove'),
          'netAskMove': v.get('netAskMove'),
          'first': v.get('first'),
          'last': {kk: vv for kk, vv in (v.get('last') or {}).items() if kk in ('symbol','bid','ask','mid','spread','tradingStatus','eventClass','at','prevBid','prevAsk')}
        } for k, v in (obj.get('instrumentOutcomes') or {}).items()
      },
      'blockers': obj.get('blockers'),
      'sampleCount': len(obj.get('samples') or []),
      'lastSample': (obj.get('samples') or [None])[-1],
    }
    print(json.dumps(slim, indent=2)[:14000])
except Exception as e:
    print(text[-8000:])
    print('parse_error', str(e)[:120])
"
            echo '```'
          } >"$BODY_FILE"
          export BODY_FILE
          export COMMENT_SHA="${EXPECT_SHA}"
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ.get("COMMENT_SHA") or os.environ["GITHUB_SHA"]
          body = open(os.environ["BODY_FILE"], encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "kwizera-phase418f2-live-obs",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("commit_comment_status", resp.status)
          PY
          exit "$rc"
