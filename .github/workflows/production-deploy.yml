# Deploy KWIZERA AI STUDIO to production after main-branch validation.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS (recommended), VPS_PORT (optional).
name: Production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to deploy (defaults to this workflow SHA)
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment and studio tests
        run: npx vitest run tests/unit/deploy tests/unit/dev/server tests/unit/ai/creative-workspace tests/unit/ai/image-intelligence/png-pixels.test.ts tests/unit/ai/image-intelligence/step6-image-ingestion.test.ts tests/unit/ai/image-intelligence/image-intelligence-manager.test.ts tests/unit/ai/product-intelligence/product-intelligence-manager.test.ts tests/unit/ai/product-intelligence/step7-product-intelligence.test.ts tests/unit/ai/product-intelligence/step7-hardening.test.ts tests/unit/ai/product-record/canonical-product-manager.test.ts tests/unit/ai/product-asset-preparation/product-asset-preparation-manager.test.ts tests/unit/ai/product-asset-preparation/mask-generation.test.ts tests/unit/ai/marketing-intelligence/marketing-intelligence-manager.test.ts tests/unit/ai/marketing-brief/marketing-brief-manager.test.ts tests/unit/ai/creative-planning/creative-planning-manager.test.ts tests/unit/ai/creative-planning/step3-production-plan.test.ts tests/unit/ai/creative-planning/plan-validator.test.ts tests/unit/ai/creative-planning/ai-creative-planner.test.ts tests/unit/ai/ai-director/step7-ai-director.test.ts tests/unit/ai/ai-director/step8-production-hardening.test.ts tests/unit/ai/video-style/step3-video-style.test.ts tests/unit/ai/video-production/step8-video-production.test.ts tests/unit/ai/video-production/step8-hardening.test.ts tests/unit/ai/video-production/step4-video-production.test.ts tests/unit/ai/video-production/step5-video-export.test.ts tests/unit/ai/product-setup/step1-product-setup.test.ts tests/unit/ai/marketing-brief/step2-video-requirements.test.ts tests/unit/ai/media-intelligence/step2-media-intelligence.test.ts tests/unit/ai/media-intelligence/step2-ollama-readiness.test.ts tests/unit/ai/media-intelligence/step2-upload-pipeline.test.ts tests/unit/ai/media-intelligence/step4-image-prep.test.ts tests/unit/ai/media-intelligence tests/workflow-step4-production.test.ts

      - name: Production build (server + Vite studio)
        run: npm run build:production

      - name: Verify studio UI artifacts and routing
        run: npm run verify:studio-ui

      - name: Confirm required artifacts
        run: |
          test -f dist/dev/server/production-gateway.js
          test -f dist/dev/server/index.js
          test -f dev/ui/desktop/index.html
          if grep -q "Dev Dashboard" dev/ui/desktop/index.html; then
            echo "studio index must not be the Dev Dashboard" >&2
            exit 1
          fi

  deploy:
    name: Deploy exact commit to VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY" >&2
            echo "Configure them on the repository (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi

      - name: Deploy requested SHA over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "DEPLOY_SHA is not a git commit SHA" >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os, pathlib
          home = pathlib.Path.home() / ".ssh"
          def write(name, raw, unescape_if_single_line=True):
              text = (raw or "").replace("\r\n", "\n").replace("\r", "\n")
              if unescape_if_single_line and "BEGIN" in text and text.count("\n") < 2:
                  text = text.replace("\\n", "\n")
              if text and not text.endswith("\n"):
                  text += "\n"
              path = home / name
              path.write_text(text, encoding="utf-8")
          write("deploy_key", os.environ["VPS_SSH_KEY"])
          known = os.environ.get("VPS_KNOWN_HOSTS", "")
          if known.strip():
              hosts = known.replace("\r\n", "\n").replace("\r", "\n")
              if hosts.count("\n") < 1:
                  hosts = hosts.replace("\\n", "\n")
              if hosts and not hosts.endswith("\n"):
                  hosts += "\n"
              (home / "known_hosts").write_text(hosts, encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o NumberOfPasswordPrompts=0 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" \
            "sudo -- /opt/kwizera-ai/deploy/update-from-github.sh ${DEPLOY_SHA}"
          echo "requestedCommit=${DEPLOY_SHA}"
