# Deploy KWIZERA AI STUDIO to production after main-branch validation.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS (recommended), VPS_PORT (optional; default 2222 Dropbear).
name: Production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to deploy (defaults to this workflow SHA)
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment and studio tests
        run: npx vitest run tests/unit/deploy tests/unit/dev/server tests/unit/desktop/forex-shell.test.ts tests/unit/desktop/forex-chart.test.ts tests/unit/desktop/forex-phase11-data-integrity.test.ts tests/unit/desktop/forex-phase12-central-market.test.ts tests/unit/desktop/forex-phase13-consistency.test.ts tests/unit/desktop/forex-phase15-technical-analysis.test.ts tests/unit/desktop/forex-phase16-charts-ta-consistency.test.ts tests/unit/desktop/forex-phase17-ai-foundation.test.ts tests/unit/desktop/forex-phase18-market-state.test.ts tests/unit/desktop/forex-admin-phase19.test.ts tests/unit/ai/forex-knowledge/forex-knowledge-phase19.test.ts tests/unit/desktop/forex-phase20-ai-analysis.test.ts tests/unit/desktop/forex-phase21-mtf-ai.test.ts tests/unit/desktop/forex-phase22-decision.test.ts tests/unit/ai/forex-memory/forex-memory-phase23.test.ts tests/unit/ai/market-data/binance-foundation.test.ts tests/unit/ai/market-data/binance-markets.test.ts tests/unit/ai/market-data/binance-live-ticker.test.ts tests/unit/ai/market-data/binance-klines.test.ts tests/unit/ai/market-data/forexconnect-phase33.test.ts tests/unit/ai/market-data/forexconnect-phase34.test.ts tests/unit/desktop/forex-live-market-status.test.ts tests/unit/dev/server/binance-market-data-api.test.ts tests/unit/ai/knowledge/phase17-knowledge-base.test.ts tests/unit/ai/training/phase18-training-center.test.ts tests/unit/ai/training/phase18b-teaching-sessions.test.ts tests/unit/ai/training/phase18c-multimodal.test.ts tests/unit/ai/training/phase18d-multimodal.test.ts tests/unit/ai/training/phase19-cross-modal.test.ts tests/unit/ai/training/phase20-media-ingestion.test.ts tests/unit/ai/training/phase20-media-ingestion.test.ts tests/unit/desktop/admin-control-center.test.ts tests/unit/desktop/customer-platform.test.ts tests/unit/desktop/customer-service-workspace.test.ts tests/unit/desktop/pmv-customer-workspace.test.ts tests/unit/desktop/pmv-audio.test.ts tests/unit/desktop/pmv-progress.test.ts tests/unit/desktop/customer-hardening.test.ts tests/unit/desktop/product-identity-lock.test.ts tests/unit/desktop/pmv-creative.test.ts tests/unit/desktop/pmv-final.test.ts tests/unit/desktop/pmv-qa.test.ts tests/unit/ai/pmv-qa/phase6-vision-identity.test.ts tests/unit/ai/image-preparation/phase7-image-preparation.test.ts tests/unit/ai/pmv-orchestrator tests/unit/ai/admin-control-plane tests/unit/ai/creative-workspace tests/unit/storage/safe-json.test.ts tests/unit/ai/image-intelligence/png-pixels.test.ts tests/unit/ai/image-intelligence/step6-image-ingestion.test.ts tests/unit/ai/image-intelligence/image-intelligence-manager.test.ts tests/unit/ai/product-intelligence/product-intelligence-manager.test.ts tests/unit/ai/product-intelligence/step7-product-intelligence.test.ts tests/unit/ai/product-intelligence/step7-hardening.test.ts tests/unit/ai/product-record/canonical-product-manager.test.ts tests/unit/ai/product-asset-preparation/product-asset-preparation-manager.test.ts tests/unit/ai/product-asset-preparation/mask-generation.test.ts tests/unit/ai/product-asset-preparation/step6-asset-quality-engine.test.ts tests/unit/ai/product-intake/step5-image-intake.test.ts tests/unit/ai/marketing-intelligence/marketing-intelligence-manager.test.ts tests/unit/ai/marketing-brief/marketing-brief-manager.test.ts tests/unit/ai/creative-planning/creative-planning-manager.test.ts tests/unit/ai/creative-planning/step3-production-plan.test.ts tests/unit/ai/creative-planning/plan-validator.test.ts tests/unit/ai/creative-planning/ai-creative-planner.test.ts tests/unit/ai/ai-director/step7-ai-director.test.ts tests/unit/ai/ai-director/step8-production-hardening.test.ts tests/unit/ai/ai-director/step9-ollama-readiness.test.ts tests/unit/ai/ai-director/step10-ollama-inference.test.ts tests/unit/ai/ai-director/ollama-capability-probe.test.ts tests/unit/ai/ai-director/ollama-deep-integration.test.ts tests/unit/ai/video-style/step3-video-style.test.ts tests/unit/ai/video-production/step8-video-production.test.ts tests/unit/ai/video-production/step8-hardening.test.ts tests/unit/ai/video-production/step4-video-production.test.ts tests/unit/ai/video-production/step5-video-export.test.ts tests/unit/ai/video-production/step7-motion-direction.test.ts tests/unit/ai/video-production/step8-engine1-acceptance.test.ts tests/unit/ai/video-production/step9-smart-camera.test.ts tests/unit/ai/video-production/step10-scene-composition.test.ts tests/unit/ai/video-production/phase16-canvas-audio-fit.test.ts tests/unit/ai/video-production/step11-engine1-final.test.ts tests/unit/ai/video-production/step12-workspace-integration.test.ts tests/unit/ai/video-production/step2a-brand-identity.test.ts tests/unit/ai/video-production/step2b-audio-assets.test.ts tests/unit/ai/audio-intelligence/step2c-audio-intelligence.test.ts tests/unit/ai/video-production/step2d-beat-sync-timing.test.ts tests/unit/ai/ai-sound/step2e-ai-sound.test.ts tests/unit/ai/audio-visual-director/step2f-av-director.test.ts tests/unit/ai/video-production/final-hardening.test.ts tests/unit/ai/product-setup/step1-product-setup.test.ts tests/unit/ai/marketing-brief/step2-video-requirements.test.ts tests/unit/ai/media-intelligence/step2-media-intelligence.test.ts tests/unit/ai/media-intelligence/step2-ollama-readiness.test.ts tests/unit/ai/media-intelligence/step2-upload-pipeline.test.ts tests/unit/ai/media-intelligence/step4-image-prep.test.ts tests/unit/ai/media-intelligence tests/workflow-step4-production.test.ts tests/unit/ai/typography/step1-typography-foundation.test.ts tests/unit/ai/typography/step2-typography-render.test.ts tests/unit/ai/typography/step3-adaptive-hierarchy.test.ts tests/unit/ai/typography/step4-region-contrast.test.ts

      - name: Production build (server + Vite studio)
        run: npm run build:production

      - name: Verify studio UI artifacts and routing
        run: npm run verify:studio-ui

      - name: Confirm required artifacts
        run: |
          test -f dist/dev/server/production-gateway.js
          test -f dist/dev/server/index.js
          test -f dev/ui/desktop/index.html
          if grep -q "Dev Dashboard" dev/ui/desktop/index.html; then
            echo "studio index must not be the Dev Dashboard" >&2
            exit 1
          fi

  deploy:
    name: Deploy exact commit to VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing GitHub Actions secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY" >&2
            echo "Configure them on the repository (Settings → Secrets and variables → Actions)." >&2
            exit 1
          fi

      - name: Deploy requested SHA over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DEPLOY_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "DEPLOY_SHA is not a git commit SHA" >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          python3 - <<'PY'
          import os, pathlib
          home = pathlib.Path.home() / ".ssh"
          def write(name, raw, unescape_if_single_line=True):
              text = (raw or "").replace("\r\n", "\n").replace("\r", "\n")
              if unescape_if_single_line and "BEGIN" in text and text.count("\n") < 2:
                  text = text.replace("\\n", "\n")
              if text and not text.endswith("\n"):
                  text += "\n"
              path = home / name
              path.write_text(text, encoding="utf-8")
          write("deploy_key", os.environ["VPS_SSH_KEY"])
          known = os.environ.get("VPS_KNOWN_HOSTS", "")
          if known.strip():
              hosts = known.replace("\r\n", "\n").replace("\r", "\n")
              if hosts.count("\n") < 1:
                  hosts = hosts.replace("\\n", "\n")
              if hosts and not hosts.endswith("\n"):
                  hosts += "\n"
              (home / "known_hosts").write_text(hosts, encoding="utf-8")
          PY
          chmod 600 "$HOME/.ssh/deploy_key"
          : >"$HOME/kwizera-deploy-ssh.log"
          # Dropbear :2222 is root key auth (OpenSSH hostbound workaround; deploy/vps-step2.sh).
          # OpenSSH :22 advertises publickey-hostbound and often rejects the same key.
          # Prefer root@2222 first even when VPS_USER/VPS_PORT secrets still point at kwizera@:22.
          PORT_CANDIDATES=(2222 22)
          USER_CANDIDATES=("root")
          if [ -n "${VPS_USER:-}" ] && [ "$VPS_USER" != "root" ]; then
            USER_CANDIDATES+=("$VPS_USER")
          fi
          SSH_BASE=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o NumberOfPasswordPrompts=0
            -o ConnectTimeout=12
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=120
            -o StrictHostKeyChecking=accept-new
          )
          SSH_PORT=""
          SSH_LOGIN=""
          REMOTE_USER=""
          for candidate in "${PORT_CANDIDATES[@]}"; do
            ssh-keyscan -p "$candidate" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "$HOME/.ssh/known_hosts"
            for login in "${USER_CANDIDATES[@]}"; do
              echo "[KWIZERA] SSH preflight ${login}@${VPS_HOST}:${candidate}" | tee -a "$HOME/kwizera-deploy-ssh.log"
              if preflight_out="$(ssh "${SSH_BASE[@]}" -p "$candidate" "$login@$VPS_HOST" \
                "echo SSH_OK; id -un; command -v sudo || true" 2>&1)"; then
                echo "$preflight_out" | tee -a "$HOME/kwizera-deploy-ssh.log"
                SSH_PORT="$candidate"
                SSH_LOGIN="$login"
                REMOTE_USER="$(printf '%s\n' "$preflight_out" | awk 'NR==2 {print; exit}')"
                break 2
              fi
              echo "$preflight_out" | tee -a "$HOME/kwizera-deploy-ssh.log" >&2 || true
              echo "[KWIZERA] SSH preflight failed for ${login}@:${candidate}" | tee -a "$HOME/kwizera-deploy-ssh.log" >&2
            done
          done
          if [ -z "$SSH_PORT" ]; then
            {
              echo "[KWIZERA] SSH authentication failed for users=${USER_CANDIDATES[*]} ports=${PORT_CANDIDATES[*]}"
              echo "[KWIZERA] Check secrets VPS_HOST/VPS_USER/VPS_SSH_KEY. Dropbear :2222 expects root key auth."
            } | tee -a "$HOME/kwizera-deploy-ssh.log" >&2
            {
              echo "## Deploy SSH failure"
              echo '```'
              tail -n 120 "$HOME/kwizera-deploy-ssh.log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "[KWIZERA] starting deploy script for ${DEPLOY_SHA} via ${SSH_LOGIN}@:${SSH_PORT} user=${REMOTE_USER:-unknown}" | tee -a "$HOME/kwizera-deploy-ssh.log"
          remote_deploy() {
            local remote_cmd="$1"
            ssh "${SSH_BASE[@]}" -p "$SSH_PORT" "$SSH_LOGIN@$VPS_HOST" "$remote_cmd" 2>&1 | tee -a "$HOME/kwizera-deploy-ssh.log"
            return "${PIPESTATUS[0]}"
          }
          set +e
          if [ "${REMOTE_USER:-}" = "root" ]; then
            remote_deploy "env KWIZERA_DEPLOY_SHA=${DEPLOY_SHA} /opt/kwizera-ai/deploy/update-from-github.sh ${DEPLOY_SHA}"
            deploy_rc=$?
          else
            remote_deploy "sudo -n KWIZERA_DEPLOY_SHA=${DEPLOY_SHA} /opt/kwizera-ai/deploy/update-from-github.sh ${DEPLOY_SHA}"
            deploy_rc=$?
            if [ "$deploy_rc" -ne 0 ] && grep -qiE 'sudo:|not allowed|a password is required|sorry' "$HOME/kwizera-deploy-ssh.log"; then
              echo "[KWIZERA] SETENV sudo form failed; retrying with sudo -- env" | tee -a "$HOME/kwizera-deploy-ssh.log" >&2
              remote_deploy "sudo -n -- env KWIZERA_DEPLOY_SHA=${DEPLOY_SHA} /opt/kwizera-ai/deploy/update-from-github.sh ${DEPLOY_SHA}"
              deploy_rc=$?
            fi
          fi
          set -e
          if [ "$deploy_rc" -ne 0 ]; then
            {
              echo "## Deploy SSH failure (exit ${deploy_rc})"
              echo "Port: ${SSH_PORT} / user: ${REMOTE_USER:-unknown}"
              echo '```'
              tail -n 260 "$HOME/kwizera-deploy-ssh.log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit "$deploy_rc"
          fi
          echo "requestedCommit=${DEPLOY_SHA}"
          {
            echo "## Deploy SSH success"
            echo "Login: ${SSH_LOGIN}@:${SSH_PORT} / user: ${REMOTE_USER:-unknown} / sha: ${DEPLOY_SHA}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish deploy failure excerpt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG="$HOME/kwizera-deploy-ssh.log"
          if [ ! -f "$LOG" ]; then
            echo "no SSH deploy log captured" >"$LOG"
          fi
          # Never publish private-key material if it accidentally entered the log.
          if grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' "$LOG"; then
            echo "refusing to publish log containing private key material" >&2
            exit 0
          fi
          BODY_FILE="${RUNNER_TEMP}/deploy-failure-body.md"
          {
            echo "### Deploy SSH failure excerpt"
            echo
            echo "Automated excerpt from the failed Production deploy SSH step (no secrets)."
            echo
            echo '```text'
            tail -n 240 "$LOG"
            echo '```'
          } >"$BODY_FILE"
          export BODY_FILE
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          body = open(os.environ["BODY_FILE"], encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "kwizera-deploy-recovery",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              print("commit_comment_status", resp.status)
          PY
