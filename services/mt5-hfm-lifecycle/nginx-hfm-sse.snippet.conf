# HFM MT5 SSE — route-specific long-lived stream settings.
# Include inside the HTTPS server block that proxies to kwizera-ai (127.0.0.1:5174).
# Do not apply globally. Do not expose the AF_UNIX agent socket.
#
# location = /api/forex/providers/mt5-hfm/stream {
#     proxy_pass http://127.0.0.1:5174;
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_buffering off;
#     proxy_cache off;
#     gzip off;
#     chunked_transfer_encoding on;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
# }

location = /api/forex/providers/mt5-hfm/stream {
    proxy_pass http://127.0.0.1:5174;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
