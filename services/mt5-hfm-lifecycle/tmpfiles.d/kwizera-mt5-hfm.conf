# Create /run/kwizera paths at boot so systemd ReadWritePaths mount namespacing succeeds.
# Without these, kwizera-mt5-hfm-demo/agent fail with status=226/NAMESPACE after reboot.
d /run/kwizera 0750 mt5 kwizera -
d /run/kwizera/mt5-hfm 0750 mt5 kwizera -
d /run/kwizera/mt5-hfm-stage 0700 kwizera kwizera -
